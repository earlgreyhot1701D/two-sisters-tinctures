<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Sisters Tinctures mockup v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=IM+Fell+DW+Pica&display=swap" rel="stylesheet">
<style>
/* ============ TWO SISTERS TINCTURES: BRAND TOKENS ============
   Type: two families, fixed roles, no italics.
     Display (IM Fell DW Pica): wordmark, product names, titles. 20px and up only.
     Text (Libre Caslon Text): everything you read or tap. Same print lineage
       as the Fell types, drawn for screen reading at body sizes.
   Scale: 13 caption / 15 small / 17 body / 20 / 28 / 36 / 56 display.
   Color roles: amber = act, red = warn, brass = structure, paper = a label.
   ============================================================= */
:root{
  --label-paper:#E9ECE3; --label-ink:#22304A; --label-ink-soft:#4E5A6E; /* labels stay paper in dark mode */
  --t-cap:13px; --t-sm:15px; --t-body:17px;
  --d-s:20px; --d-m:28px; --d-l:36px; --d-xl:56px;
  --page:#13261F;
  --cabinet:#1E3A32;
  --drawer:#24453B;
  --drawer-edge:#173029;
  --paper:#E9ECE3;
  --paper-2:#DCE2D3;
  --ink:#22304A;
  --ink-soft:#4E5A6E;
  --amber:#9C6515;
  --amber-glow:#C9902F;
  --on-amber:#FFF8EC;
  --brass:#A88B4A;
  --red:#A1272F;
  --red-wash:#F3E1DF;
  --amber-wash:#F1E6CF;
  --on-cabinet:#E9ECE3;
  --on-cabinet-soft:#B9C6BC;
  --display:"IM Fell DW Pica", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --body:"Libre Caslon Text", "Iowan Old Style", Georgia, "Times New Roman", serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0B1612; --cabinet:#16302A; --drawer:#1D3B32; --drawer-edge:#10241E;
    --paper:#212F29; --paper-2:#2A3A33; --ink:#E6EADF; --ink-soft:#B3BDB0;
    --red:#E0868B; --red-wash:#3A2224; --amber-wash:#3A2E18; --amber-glow:#D9A445;
  }
}
:root[data-theme="dark"]{
  --page:#0B1612; --cabinet:#16302A; --drawer:#1D3B32; --drawer-edge:#10241E;
  --paper:#212F29; --paper-2:#2A3A33; --ink:#E6EADF; --ink-soft:#B3BDB0;
  --red:#E0868B; --red-wash:#3A2224; --amber-wash:#3A2E18; --amber-glow:#D9A445;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:var(--body);font-size:var(--t-body);line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber-glow);outline-offset:2px}

.mock-note{display:none;max-width:420px;margin:20px auto 0;color:var(--on-cabinet-soft);font-size:var(--t-sm);line-height:1.45;padding:0 4px}
.mock-note strong{color:var(--on-cabinet)}

.app{position:relative;max-width:420px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--cabinet)}
.scroll{flex:1}

@media (min-width:600px){
  .mock-note{display:block}
  .app{margin:14px auto 32px;height:min(860px,calc(100vh - 110px));min-height:0;border-radius:30px;overflow:hidden;border:8px solid #0A1410;box-shadow:0 30px 60px rgba(0,0,0,.45)}
  .scroll{overflow-y:auto}
}

.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(6,14,11,.82) 0%,rgba(6,14,11,.25) 34%,rgba(6,14,11,0) 52%,rgba(30,58,50,.55) 80%,var(--cabinet) 100%);pointer-events:none}
.hero-inner{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:20px 18px 18px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.wordmark{margin:0;font-weight:400;line-height:1;color:#CDB27A}
.wm-small{display:block;font-family:var(--display);font-size:var(--d-s);letter-spacing:.08em;margin:0 0 4px 3px;color:#BFA56B}
.wm-big{display:block;font-family:var(--display);font-size:var(--d-xl);letter-spacing:.005em;text-shadow:0 2px 14px rgba(0,0,0,.55)}
.ghost-btn{background:rgba(6,14,11,.45);border:1px solid var(--brass);color:var(--on-cabinet);border-radius:999px;padding:7px 14px;font-size:var(--t-sm);margin-top:6px}
.bubble{position:relative;align-self:flex-start;max-width:78%;background:var(--label-paper);color:var(--label-ink);border-radius:16px 16px 16px 4px;padding:11px 14px;font-size:var(--t-body);line-height:1.4;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.bubble b{font-weight:700}

/* marquee */
.marquee{overflow:hidden;border-top:1px solid rgba(168,139,74,.45);border-bottom:1px solid rgba(168,139,74,.45);margin:4px 0 0;padding:7px 0;color:var(--on-cabinet-soft);font-family:var(--body);font-size:var(--t-sm);letter-spacing:.01em;white-space:nowrap}
.marquee-track{display:inline-block;animation:drift 38s linear infinite}
.marquee-track span{margin:0 14px}
.marquee-track .gem{color:var(--brass);font-size:11px; /* ornament, not type */vertical-align:2px}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.about-link{display:block;margin:0 auto 26px;border:0;background:none;color:var(--on-cabinet-soft);font-size:var(--t-sm);text-decoration:underline;text-decoration-color:var(--brass);text-underline-offset:3px}
.demo-banner{margin:14px 18px 0;color:var(--on-cabinet-soft);font-size:var(--t-sm)}

/* tabs */
.tabs{display:flex;gap:4px;margin:14px 18px 0;background:var(--drawer-edge);padding:4px;border-radius:12px}
.tab{flex:1;border:0;background:none;color:var(--on-cabinet-soft);padding:9px 6px;border-radius:9px;font-size:var(--t-sm);font-weight:700}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink)}

/* notes */
.notes{list-style:none;margin:14px 18px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.note{width:100%;text-align:left;border:0;border-radius:10px;padding:12px 14px;font-size:var(--t-body);line-height:1.5;display:flex;gap:10px;align-items:flex-start;background:var(--paper);color:var(--ink)}
.note .dot{flex:0 0 10px;height:10px;border-radius:50%;margin-top:6px;background:var(--ink-soft)}
.note.red{background:var(--red-wash)} .note.red .dot{background:var(--red)}
.note.amber{background:var(--amber-wash)} .note.amber .dot{background:var(--amber-glow)}

/* cabinet */
.cabinet{margin:16px 12px 20px;padding:10px;border-radius:6px;background:var(--drawer-edge);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drawer{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:10px;padding:14px 10px 12px;border:0;border-radius:4px;background:var(--drawer);box-shadow:inset 0 1px 0 rgba(255,255,255,.07), inset 0 -2px 0 rgba(0,0,0,.25);transition:transform .22s ease, box-shadow .22s ease}
.drawer.pulled{transform:translateY(-3px) scale(1.035);box-shadow:inset 0 0 0 2px var(--amber-glow),0 10px 18px rgba(0,0,0,.35)}
.holder{position:relative;width:100%;min-height:88px;display:flex;flex-direction:column;justify-content:center;padding:8px 10px;border:1.5px solid var(--brass);border-radius:3px;background:var(--label-paper);text-align:center}
.holder::before,.holder::after{content:"";position:absolute;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--brass)}
.holder::before{left:-9px}.holder::after{right:-9px}
.pname{display:block;font-family:var(--display);font-size:var(--d-s);line-height:1.15;color:var(--label-ink)}
.ptype{display:block;font-size:var(--t-cap);color:var(--label-ink-soft);margin-top:2px}
.knob{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E2C988,var(--brass) 55%,#6F5A2A)}
.flag{position:absolute;top:-6px;right:-4px;font-size:var(--t-cap);font-weight:700;padding:2px 8px;border-radius:999px;background:var(--red);color:#fff}
.flag.soon{background:var(--amber);color:var(--on-amber)}

/* routine */
.routine{margin:16px 18px 24px;background:var(--paper);border-radius:10px;padding:16px}
.routine h2{font-family:var(--display);font-weight:400;font-size:var(--d-m);margin:0 0 4px;line-height:1.1}
.routine .lede{margin:0 0 12px;color:var(--ink-soft);font-size:var(--t-sm)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--paper-2)}
.step:first-child{border-top:0}
.num{width:30px;height:30px;border-radius:50%;background:var(--amber);color:var(--on-amber);display:grid;place-items:center;font-weight:700;font-size:var(--t-sm)}
.step-name{font-family:var(--display);font-size:var(--d-s);line-height:1.2;background:none;border:0;padding:0;text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--brass);text-underline-offset:3px}
.step-why{margin:2px 0 0;font-size:var(--t-sm);color:var(--ink-soft)}
.step-warn{margin:4px 0 0;font-size:var(--t-sm);color:var(--red);font-weight:700}

/* add bar */
.addbar{position:sticky;bottom:0;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--cabinet) 70%,transparent)}
.primary{width:100%;border:0;border-radius:12px;padding:14px 16px;background:var(--amber);color:var(--on-amber);font-weight:700;font-size:var(--t-body)}
.secondary{width:100%;border:1.5px solid var(--ink-soft);border-radius:12px;padding:12px 16px;background:transparent;color:var(--ink);font-weight:700}
.textbtn{border:0;background:none;color:var(--red);font-weight:700;padding:10px 0}

/* sheets */
.backdrop{position:fixed;inset:0;background:rgba(5,12,9,.55);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:20}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,420px);max-height:88%;overflow-y:auto;transform:translate(-50%,105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);background:var(--paper);color:var(--ink);border-radius:18px 18px 0 0;z-index:21;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:translate(-50%,0)}
@media (min-width:600px){
  .backdrop,.sheet{position:absolute}
}
.handle{width:44px;height:5px;border-radius:3px;background:var(--brass);margin:0 auto 12px;opacity:.7}
.sheet-close{display:block;margin:0 0 6px auto;border:0;background:none;color:var(--ink-soft);font-size:var(--t-sm);padding:4px 0 4px 10px;text-decoration:underline}
.label-card{border:1.5px solid var(--ink);outline:1px solid var(--ink);outline-offset:3px;border-radius:2px;padding:16px;margin:8px 4px 16px}
.label-card h2{font-family:var(--display);font-weight:400;font-size:var(--d-l);line-height:1.05;margin:0}
.brand{margin:4px 0 0;color:var(--ink-soft);font-size:var(--t-sm)}
.rule{border:0;border-top:1px solid var(--brass);margin:14px 0}
.sheet h3{font-size:var(--t-sm);font-weight:700;margin:16px 0 4px;color:var(--ink)}
.sheet p{margin:0 0 8px}
.ingredients{list-style:none;margin:0;padding:0}
.ingredients li{padding:8px 0;border-top:1px solid var(--paper-2);font-size:var(--t-body)}
.ingredients li:first-child{border-top:0}
.ingredients b{font-weight:700}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:var(--t-body);margin:0}
.facts dt{color:var(--ink-soft)} .facts dd{margin:0;font-weight:700}
.facts dd.past{color:var(--red)} .facts dd.soon{color:var(--amber)}
.warn{background:var(--red-wash);color:var(--ink);border-left:4px solid var(--red);padding:10px 12px;border-radius:6px;font-size:var(--t-body);margin:14px 0}
.fine{font-size:var(--t-cap);color:var(--ink-soft);margin-top:14px}
.btn-row{display:flex;flex-direction:column;gap:10px;margin-top:16px}

/* add flow */
.sheet h2.sheet-title{font-family:var(--display);font-weight:400;font-size:var(--d-m);margin:0 0 12px;line-height:1.1}
.option{display:block;width:100%;text-align:left;border:1.5px solid var(--brass);background:var(--paper);border-radius:12px;padding:14px 16px;margin-bottom:10px;color:var(--ink)}
.option b{display:block;font-size:var(--t-body)}
.option span{display:block;font-size:var(--t-sm);color:var(--ink-soft);margin-top:2px}
.field{display:block;margin:12px 0 0;font-size:var(--t-sm);font-weight:700}
.field input,.field select,.field textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1.5px solid var(--ink-soft);border-radius:10px;background:var(--paper);font-weight:400;font-size:var(--t-body)}
.field textarea{min-height:110px;resize:vertical}
.missing{color:var(--amber);font-weight:700;font-size:var(--t-cap)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-weight:400;font-size:var(--t-sm);padding:4px 10px;border-radius:999px;background:var(--paper-2)}
.bottle-wrap{display:grid;place-items:center;padding:16px 0 8px}
.bottle{position:relative;width:96px;height:150px}
.bottle .neck{position:absolute;left:34px;top:0;width:28px;height:26px;background:#3A2A12;border-radius:4px 4px 0 0}
.bottle .body{position:absolute;left:0;top:24px;width:96px;height:126px;background:linear-gradient(90deg,#7A4A10,#B07524 45%,#7A4A10);border-radius:18px 18px 12px 12px;overflow:hidden}
.bottle .tag{position:absolute;left:12px;right:12px;top:36px;height:58px;background:#F4EFE2;border-radius:3px;overflow:hidden}
.bottle .tag::before{content:"";position:absolute;left:8px;right:8px;top:12px;height:3px;background:#B7AE98;box-shadow:0 10px 0 #B7AE98,0 20px 0 #B7AE98,0 30px 0 #B7AE98}
.scan{position:absolute;left:0;right:0;height:16px;top:-16px;background:linear-gradient(to bottom,transparent,rgba(201,144,47,.55),transparent);animation:scan 1.3s ease-in-out infinite}
@keyframes scan{to{top:58px}}
.status{text-align:center;color:var(--ink-soft);margin:6px 0 0}
.info{background:var(--amber-wash);border-left:4px solid var(--amber-glow);padding:10px 12px;border-radius:6px;font-size:var(--t-body);margin:14px 0}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:var(--t-sm);transition:all .25s ease;z-index:30;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:600px){.toast{position:absolute}}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion: reduce){
  .drawer,.sheet,.backdrop,.toast{transition:none}
  .marquee-track{animation:none}
  .drawer.pulled{transform:none}
  .scan{animation:none;display:none}
}
</style>

<body>

<p class="mock-note"><strong>Two Sisters Tinctures, mockup v4.</strong> Mock data only. No model is wired yet, and nothing saves. Voice lines are placeholders until my sister approves them. Tap a drawer, switch to Morning or Night, and try Add a product.</p>

<div class="app" id="app">
  <div class="scroll" id="scroll">
    <header class="hero" role="img" aria-label="A painted apothecary at dusk: shelves of amber and green glass bottles, a brass scale and mortar on a candlelit counter.">
      <div class="hero-inner">
        <div class="hero-top">
          <h1 class="wordmark"><span class="wm-small">Two Sisters</span><span class="wm-big">Tinctures</span></h1>
          <button class="ghost-btn" id="backupBtn" type="button">Back up</button>
        </div>
        <p class="bubble" id="greeting"></p>
      </div>
    </header>
    <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>
    <p class="demo-banner" id="count"></p>

    <div class="tabs" role="tablist" aria-label="Views">
      <button class="tab" role="tab" type="button" data-view="shelf" aria-selected="true">Shelf</button>
      <button class="tab" role="tab" type="button" data-view="am" aria-selected="false">Morning</button>
      <button class="tab" role="tab" type="button" data-view="pm" aria-selected="false">Night</button>
    </div>

    <main id="view"></main>
    <button class="about-link" id="aboutBtn" type="button">About Two Sisters Tinctures</button>
  </div>

  <div class="addbar">
    <button class="primary" id="addBtn" type="button">Add a product</button>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
  "use strict";

  // ---------- Mock data (deterministic facts live here, never in the model) ----------
  var TODAY = new Date(2026, 9, 2); // mock "today" so expiry states are stable in the demo

  var FACTS = {
    "Glycerin":"Pulls moisture into skin.",
    "Colloidal oatmeal":"Soothes dry, itchy skin.",
    "Coco-glucoside":"A mild cleanser that won't strip.",
    "Rose water":"Soothes and adds a little hydration.",
    "Hyaluronic acid":"Holds water in skin, like a sponge.",
    "Sodium hyaluronate":"A form of hyaluronic acid. Holds water in skin.",
    "Glycolic acid":"Dissolves dead skin for smoother texture.",
    "Aloe":"Calms and cools.",
    "Ascorbic acid":"Vitamin C. Brightens dullness.",
    "Vitamin E":"Moisturizes and helps vitamin C stay stable.",
    "Ferulic acid":"Helps vitamin C last longer.",
    "Niacinamide":"Calms redness and evens tone.",
    "Zinc":"Helps keep oil in check.",
    "Retinol":"Speeds up skin renewal.",
    "Squalane":"A light oil that softens without feeling greasy.",
    "Ceramides":"Help rebuild the skin barrier.",
    "Caffeine":"Helps with morning puffiness.",
    "Peptides":"Support a firmer feel.",
    "Shea butter":"Rich, cushioning moisture.",
    "Cholesterol":"Works with ceramides on the barrier.",
    "Zinc oxide":"Mineral filter that blocks UV.",
    "Titanium dioxide":"Mineral filter that blocks UV.",
    "Panthenol":"Vitamin B5. Soothes and hydrates."
  };

  // Routine order is plain code: thinnest to thickest, sunscreen last.
  var ORDER = {"Cleanser":1,"Toner":2,"Serum":3,"Eye cream":4,"Moisturizer":5,"Facial oil":6,"Sunscreen":7};
  var WHY = {
    "Cleanser":"Start clean so everything else can sink in.",
    "Toner":"Goes on while skin is still damp.",
    "Serum":"Thin and concentrated, so it goes on early.",
    "Eye cream":"Gentle, before the heavier layers.",
    "Moisturizer":"Seals in the layers underneath.",
    "Facial oil":"Last at night to lock everything in.",
    "Sunscreen":"Always the last step in the morning."
  };
  var NO_DOUBLES = ["Cleanser","Eye cream","Moisturizer","Sunscreen"];
  var CONFLICTS = [["Retinol","Glycolic acid"]];

  var products = [
    {id:"p1",name:"Oat milk cleanser",brand:"Fernhill",type:"Cleanser",when:["am","pm"],opened:[2026,7,10],pao:12,
      does:"A gentle wash that clears off the day without stripping your skin.",
      ingredients:["Water","Glycerin","Colloidal oatmeal","Coco-glucoside"]},
    {id:"p2",name:"Rose water toner",brand:"Larkspur",type:"Toner",when:["am"],opened:[2026,5,1],pao:12,
      does:"A soft splash of hydration that preps skin for what comes next.",
      ingredients:["Rose water","Glycerin","Hyaluronic acid"]},
    {id:"p3",name:"Glycolic toner",brand:"Brightwell",type:"Toner",when:["pm"],opened:[2026,4,20],pao:12,freq:"2 to 3 nights a week",
      does:"An acid toner that loosens dead skin so your face looks smoother and brighter.",
      ingredients:["Water","Glycolic acid","Aloe","Glycerin"]},
    {id:"p4",name:"Vitamin C serum",brand:"Citrine & Co",type:"Serum",when:["am"],opened:[2026,2,2],pao:6,
      does:"Brightens dull skin and works alongside your sunscreen in the morning.",
      ingredients:["Water","Ascorbic acid","Vitamin E","Ferulic acid"]},
    {id:"p5",name:"Niacinamide serum",brand:"Larkspur",type:"Serum",when:["am","pm"],opened:[2026,6,15],pao:12,
      does:"Calms redness and evens out tone. Gets along with almost everything.",
      ingredients:["Niacinamide","Zinc","Glycerin"]},
    {id:"p6",name:"Retinol serum",brand:"Nightjar",type:"Serum",when:["pm"],opened:[2026,3,11],pao:6,
      does:"Speeds up skin renewal for smoother texture over time. Start slow, and wear sunscreen the next day.",
      ingredients:["Retinol","Squalane","Ceramides"]},
    {id:"p7",name:"Caffeine eye cream",brand:"Fernhill",type:"Eye cream",when:["am"],opened:[2026,6,1],pao:6,
      does:"Helps with puffiness under the eyes in the morning.",
      ingredients:["Caffeine","Hyaluronic acid","Peptides"]},
    {id:"p8",name:"Peptide eye cream",brand:"Nightjar",type:"Eye cream",when:["pm"],opened:[2026,5,20],pao:12,
      does:"A richer eye cream that keeps the thin skin there cushioned overnight.",
      ingredients:["Peptides","Ceramides","Shea butter"]},
    {id:"p9",name:"Ceramide moisturizer",brand:"Brightwell",type:"Moisturizer",when:["am","pm"],opened:[2026,7,1],pao:12,
      does:"Locks in everything underneath and supports your skin barrier.",
      ingredients:["Water","Ceramides","Glycerin","Niacinamide","Cholesterol"]},
    {id:"p10",name:"Mineral SPF 50",brand:"Citrine & Co",type:"Sunscreen",when:["am"],opened:[2026,4,1],pao:12,
      does:"Blocks UV. Always the last step in the morning.",
      ingredients:["Zinc oxide","Titanium dioxide","Squalane"]}
  ];

  // ---------- helpers ----------
  function el(tag, opts){
    var n = document.createElement(tag);
    opts = opts || {};
    if (opts.cls) n.className = opts.cls;
    if (opts.text != null) n.textContent = opts.text;
    if (opts.attrs) Object.keys(opts.attrs).forEach(function(k){ n.setAttribute(k, opts.attrs[k]); });
    if (opts.on) Object.keys(opts.on).forEach(function(k){ n.addEventListener(k, opts.on[k]); });
    for (var i = 2; i < arguments.length; i++){ if (arguments[i]) n.append(arguments[i]); }
    return n;
  }
  function byId(id){ return document.getElementById(id); }
  function find(id){ return products.filter(function(p){ return p.id === id; })[0]; }
  function openedDate(p){ return new Date(p.opened[0], p.opened[1], p.opened[2]); }
  function useBy(p){ var d = openedDate(p); return new Date(d.getFullYear(), d.getMonth() + p.pao, d.getDate()); }
  function fmt(d){ return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }
  function monthsOpen(p){
    var d = openedDate(p);
    return (TODAY.getFullYear() - d.getFullYear()) * 12 + (TODAY.getMonth() - d.getMonth());
  }
  function status(p){
    var days = Math.round((useBy(p) - TODAY) / 86400000);
    if (days < 0) return "past";
    if (days <= 30) return "soon";
    return "ok";
  }
  function has(p, ing){ return p.ingredients.indexOf(ing) !== -1; }
  function conflictsFor(p){
    var out = [];
    CONFLICTS.forEach(function(pair){
      var mine = null;
      if (has(p, pair[0])) mine = pair[1];
      else if (has(p, pair[1])) mine = pair[0];
      if (!mine) return;
      products.forEach(function(q){
        if (q.id !== p.id && has(q, mine) && q.when.some(function(w){ return p.when.indexOf(w) !== -1; })) out.push(q);
      });
    });
    return out;
  }
  function conflictPairs(){
    var seen = {}, out = [];
    products.forEach(function(p){
      conflictsFor(p).forEach(function(q){
        var key = [p.id, q.id].sort().join("|");
        if (!seen[key]){ seen[key] = true; out.push([p, q]); }
      });
    });
    return out;
  }
  function doubles(){
    var out = [];
    NO_DOUBLES.forEach(function(t){
      var list = products.filter(function(p){ return p.type === t; });
      if (list.length > 1) out.push({type:t, list:list});
    });
    return out;
  }

  // ---------- state ----------
  var view = "shelf";
  var lastFocus = null;
  var pulled = null;

  // ---------- render ----------
  function render(){
    byId("count").textContent = "Demo shelf with " + products.length + " products. Nothing you add here is saved.";
    var main = byId("view");
    main.replaceChildren(view === "shelf" ? renderShelf() : renderRoutine(view));
  }

  function renderShelf(){
    var wrap = el("div");
    var notes = el("ul", {cls:"notes", attrs:{"aria-label":"Things to check"}});

    conflictPairs().forEach(function(pair){
      notes.append(el("li", null, el("button", {cls:"note red", attrs:{type:"button"}, on:{click:function(){ openDetail(pair[0].id); }}},
        el("span", {cls:"dot", attrs:{"aria-hidden":"true"}}),
        el("span", {text: "Your " + pair[0].name + " and " + pair[1].name + " can't go on the same night. Trust me."}))));
    });
    products.forEach(function(p){
      var s = status(p);
      if (s === "past"){
        notes.append(el("li", null, el("button", {cls:"note amber", attrs:{type:"button"}, on:{click:function(){ openDetail(p.id); }}},
          el("span", {cls:"dot", attrs:{"aria-hidden":"true"}}),
          el("span", {text: "Your " + p.name + " has been open " + monthsOpen(p) + " months. It's best within " + p.pao + ". Time to let it go."}))));
      }
    });
    doubles().forEach(function(d){
      notes.append(el("li", null, el("button", {cls:"note", attrs:{type:"button"}, on:{click:function(){ openDetail(d.list[0].id); }}},
        el("span", {cls:"dot", attrs:{"aria-hidden":"true"}}),
        el("span", {text: d.list.length + " " + d.type.toLowerCase() + "s? Fine, if one's for morning and one's for night."}))));
    });
    wrap.append(notes);

    var grid = el("div", {cls:"grid"});
    products.forEach(function(p){
      var s = status(p);
      var btn = el("button", {cls:"drawer", attrs:{type:"button", "data-id":p.id, "aria-label": p.name + ", " + p.type + (s === "past" ? ", past its prime" : s === "soon" ? ", use soon" : "")},
        on:{click:function(){ openDetail(p.id, btn); }}},
        el("span", {cls:"holder"},
          el("span", {cls:"pname", text:p.name}),
          el("span", {cls:"ptype", text:p.type})),
        el("span", {cls:"knob", attrs:{"aria-hidden":"true"}}),
        s === "past" ? el("span", {cls:"flag", text:"Past its prime", attrs:{"aria-hidden":"true"}}) :
        s === "soon" ? el("span", {cls:"flag soon", text:"Use soon", attrs:{"aria-hidden":"true"}}) : null);
      grid.append(btn);
    });
    wrap.append(el("div", {cls:"cabinet"}, grid));
    return wrap;
  }

  function routineFor(when){
    return products.filter(function(p){ return p.when.indexOf(when) !== -1; })
      .sort(function(a,b){ return (ORDER[a.type]||9) - (ORDER[b.type]||9); });
  }

  function renderRoutine(when){
    var list = routineFor(when);
    var box = el("section", {cls:"routine", attrs:{"aria-labelledby":"rtitle"}});
    box.append(el("h2", {text: when === "am" ? "Morning routine" : "Night routine", attrs:{id:"rtitle"}}));
    box.append(el("p", {cls:"lede", text: when === "am" ? list.length + " steps. Thinnest to thickest, sunscreen last. Always." : list.length + " steps. Thinnest to thickest, then bed."}));

    var pairs = conflictPairs().filter(function(pr){ return pr[0].when.indexOf(when) !== -1 && pr[1].when.indexOf(when) !== -1; });
    var flagged = {};
    pairs.forEach(function(pr){
      flagged[pr[0].id] = true; flagged[pr[1].id] = true;
      box.append(el("p", {cls:"warn", text: pr[0].name + " and " + pr[1].name + " are both on your night list. Take turns: one night each, never together."}));
    });

    var ol = el("ol", {cls:"steps"});
    list.forEach(function(p, i){
      var why = p.freq ? WHY[p.type] + " Use " + p.freq + "." : WHY[p.type];
      ol.append(el("li", {cls:"step"},
        el("span", {cls:"num", text:String(i + 1), attrs:{"aria-hidden":"true"}}),
        el("div", null,
          el("button", {cls:"step-name", text:p.name, attrs:{type:"button", "aria-label":"Step " + (i+1) + ": " + p.name}, on:{click:function(){ openDetail(p.id); }}}),
          el("p", {cls:"step-why", text:why}),
          flagged[p.id] ? el("p", {cls:"step-warn", text:"Alternate nights"}) : null)));
    });
    box.append(ol);
    return box;
  }

  // ---------- sheets ----------
  function openSheet(build){
    var sheet = byId("sheet");
    lastFocus = document.activeElement;
    sheet.replaceChildren();
    sheet.append(el("div", {cls:"handle", attrs:{"aria-hidden":"true"}}));
    sheet.append(el("button", {cls:"sheet-close", text:"Close", attrs:{type:"button"}, on:{click:closeSheet}}));
    build(sheet);
    sheet.hidden = false;
    requestAnimationFrame(function(){
      sheet.classList.add("open");
      byId("backdrop").classList.add("open");
      var first = sheet.querySelector("h2, button, input");
      if (first){ if (first.tagName === "H2") first.setAttribute("tabindex","-1"); first.focus(); }
    });
  }
  function closeSheet(){
    var sheet = byId("sheet");
    sheet.classList.remove("open");
    byId("backdrop").classList.remove("open");
    if (pulled){ pulled.classList.remove("pulled"); pulled = null; }
    setTimeout(function(){ sheet.hidden = true; }, 300);
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  byId("backdrop").addEventListener("click", closeSheet);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !byId("sheet").hidden) closeSheet(); });

  function toast(msg){
    var t = byId("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  // ---------- detail ----------
  function openDetail(id, drawerBtn){
    var p = find(id);
    if (!p) return;
    if (drawerBtn){ pulled = drawerBtn; drawerBtn.classList.add("pulled"); }
    var delay = drawerBtn && !window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 180 : 0;
    setTimeout(function(){
      openSheet(function(sheet){
        var card = el("div", {cls:"label-card"});
        card.append(el("h2", {text:p.name, attrs:{id:"sheetTitle"}}));
        card.append(el("p", {cls:"brand", text: p.brand ? p.brand + ", " + p.type.toLowerCase() : p.type}));
        card.append(el("hr", {cls:"rule"}));
        card.append(el("h3", {text:"What it does"}));
        card.append(el("p", {text:p.does}));

        card.append(el("h3", {text:"What's in it"}));
        var ul = el("ul", {cls:"ingredients"});
        p.ingredients.forEach(function(ing){
          if (ing === "Water") return;
          ul.append(el("li", null, el("b", {text: ing + ": "}), document.createTextNode(FACTS[ing] || "No note for this one yet.")));
        });
        card.append(ul);

        card.append(el("h3", {text:"In your routine"}));
        var whenTxt = p.when.map(function(w){
          var list = routineFor(w);
          return (w === "am" ? "Morning" : "Night") + ", step " + (list.indexOf(p) + 1) + " of " + list.length;
        }).join(". ");
        card.append(el("p", {text: whenTxt + "." + (p.freq ? " Use " + p.freq + "." : "")}));

        var s = status(p);
        var dl = el("dl", {cls:"facts"},
          el("dt", {text:"Opened"}), el("dd", {text:fmt(openedDate(p))}),
          el("dt", {text:"Best within"}), el("dd", {text:p.pao + " months"}),
          el("dt", {text:"Use by"}), el("dd", {cls: s === "ok" ? "" : s, text: fmt(useBy(p)) + (s === "past" ? ", past its prime" : s === "soon" ? ", coming up" : "")}));
        card.append(el("h3", {text:"Shelf life"}));
        card.append(dl);

        conflictsFor(p).forEach(function(q){
          card.append(el("p", {cls:"warn", text:"Don't use on the same night as " + q.name + ". Together they can irritate."}));
        });

        sheet.append(card);
        sheet.append(el("p", {cls:"fine", text:"Gemma explained this from the ingredient list. Ingredient notes come from our own list, not the model. I know skincare, not medicine. If something's irritated, see a dermatologist."}));
        sheet.append(el("div", {cls:"btn-row"},
          el("button", {cls:"secondary", text:"Edit details", attrs:{type:"button"}, on:{click:function(){ toast("Editing comes in the build"); }}}),
          el("button", {cls:"textbtn", text:"Remove from shelf", attrs:{type:"button"}, on:{click:function(){
            products = products.filter(function(x){ return x.id !== p.id; });
            closeSheet(); render(); toast("Gone. Fresh start.");
          }}})));
      });
    }, delay);
  }

  // ---------- add flow ----------
  function openAdd(){ openSheet(function(sheet){ addChoose(sheet); }); }

  function resetSheetBody(sheet){
    while (sheet.children.length > 2) sheet.removeChild(sheet.lastChild);
  }

  function addChoose(sheet){
    resetSheetBody(sheet);
    sheet.append(el("h2", {cls:"sheet-title", text:"Ooh, what'd you get?", attrs:{id:"sheetTitle"}}));
    sheet.append(el("button", {cls:"option", attrs:{type:"button"}, on:{click:function(){ addReading(sheet, "photo"); }}},
      el("b", {text:"Snap the label"}), el("span", {text:"A photo of the back of the bottle works best."})));
    sheet.append(el("button", {cls:"option", attrs:{type:"button"}, on:{click:function(){ addPaste(sheet); }}},
      el("b", {text:"Paste the ingredients"}), el("span", {text:"Copy them from the box or the brand's website."})));
    sheet.append(el("button", {cls:"option", attrs:{type:"button"}, on:{click:function(){ addTyped(sheet); }}},
      el("b", {text:"Type the name"}), el("span", {text:"For the one everybody's talking about in the group chat."})));
  }

  function addPaste(sheet){
    resetSheetBody(sheet);
    sheet.append(el("h2", {cls:"sheet-title", text:"Paste the ingredients", attrs:{id:"sheetTitle"}}));
    var ta = el("textarea", {attrs:{id:"ingText"}});
    ta.value = "Water, Sodium Hyaluronate, Glycerin, Panthenol";
    sheet.append(el("label", {cls:"field", attrs:{"for":"ingText"}, text:"Ingredients"}, ta));
    sheet.append(el("div", {cls:"btn-row"},
      el("button", {cls:"primary", text:"Read ingredients", attrs:{type:"button"}, on:{click:function(){
        if (!ta.value.trim()){ toast("Paste the ingredient list first"); ta.focus(); return; }
        addReading(sheet, "paste");
      }}}),
      el("button", {cls:"secondary", text:"Back", attrs:{type:"button"}, on:{click:function(){ addChoose(sheet); }}})));
  }

  function addReading(sheet, mode){
    resetSheetBody(sheet);
    sheet.append(el("h2", {cls:"sheet-title", text: mode === "photo" ? "Let me read this label" : "Let me read these", attrs:{id:"sheetTitle"}}));
    var tag = el("div", {cls:"tag"}, el("div", {cls:"scan"}));
    sheet.append(el("div", {cls:"bottle-wrap", attrs:{"aria-hidden":"true"}},
      el("div", {cls:"bottle"}, el("div", {cls:"neck"}), el("div", {cls:"body"}, tag))));
    sheet.append(el("p", {cls:"status", text:"Hang on, this takes a few seconds…"}));
    setTimeout(function(){ addConfirm(sheet, mode); }, 1700);
  }

  function addConfirm(sheet, mode){
    resetSheetBody(sheet);
    sheet.append(el("h2", {cls:"sheet-title", text:"Here's what I see", attrs:{id:"sheetTitle"}}));
    sheet.append(el("p", {cls:"info", text: "Gemma read this from your " + (mode === "photo" ? "photo" : "list") + ". Fix anything I got wrong before you save."}));

    var name = el("input", {attrs:{id:"fName", type:"text"}}); name.value = "Hyaluronic serum";
    var brand = el("input", {attrs:{id:"fBrand", type:"text", placeholder:"Add it if you know it"}});
    var type = el("select", {attrs:{id:"fType"}});
    Object.keys(ORDER).forEach(function(t){ var o = el("option", {text:t}); if (t === "Serum") o.selected = true; type.append(o); });
    var opened = el("input", {attrs:{id:"fOpened", type:"date"}}); opened.value = "2026-10-02";
    var pao = el("select", {attrs:{id:"fPao"}});
    [3,6,12,24].forEach(function(m){ var o = el("option", {text:m + " months", attrs:{value:String(m)}}); if (m === 12) o.selected = true; pao.append(o); });

    sheet.append(el("label", {cls:"field", attrs:{"for":"fName"}, text:"Name"}, name));
    sheet.append(el("label", {cls:"field", attrs:{"for":"fBrand"}},
      document.createTextNode("Brand "), el("span", {cls:"missing", text:"Couldn't read this"}), brand));
    sheet.append(el("label", {cls:"field", attrs:{"for":"fType"}, text:"Type"}, type));

    var chips = el("div", {cls:"chips"});
    ["Sodium hyaluronate","Glycerin","Panthenol"].forEach(function(i){ chips.append(el("span", {cls:"chip", text:i})); });
    sheet.append(el("div", {cls:"field"}, document.createTextNode("Ingredients found"), chips));
    sheet.append(el("label", {cls:"field", attrs:{"for":"fOpened"}, text:"Opened"}, opened));
    sheet.append(el("label", {cls:"field", attrs:{"for":"fPao"}, text:"Best within (the little open-jar number on the label)"}, pao));

    sheet.append(el("div", {cls:"btn-row"},
      el("button", {cls:"primary", text:"Add to shelf", attrs:{type:"button"}, on:{click:function(){
        var n = name.value.trim();
        if (!n){ toast("Give it a name first"); name.focus(); return; }
        var parts = (opened.value || "2026-10-02").split("-");
        products.push({id:"p" + Date.now(), name:n.slice(0,60), brand:brand.value.trim().slice(0,40), type:type.value, when:["am","pm"],
          opened:[+parts[0], +parts[1]-1, +parts[2]], pao:+pao.value,
          does:"Gives skin a drink of water and helps it feel plump and soft.",
          ingredients:["Water","Sodium hyaluronate","Glycerin","Panthenol"]});
        closeSheet(); view = "shelf"; syncTabs(); render(); toast("On the shelf. Cute.");
      }}}),
      el("button", {cls:"secondary", text:"Start over", attrs:{type:"button"}, on:{click:function(){ addChoose(sheet); }}})));
  }

  function addTyped(sheet){
    resetSheetBody(sheet);
    sheet.append(el("h2", {cls:"sheet-title", text:"Type the name", attrs:{id:"sheetTitle"}}));
    var input = el("input", {attrs:{id:"typed", type:"text", maxlength:"80"}}); input.value = "Squalane facial oil";
    sheet.append(el("label", {cls:"field", attrs:{"for":"typed"}, text:"Product name"}, input));
    var out = el("div");
    sheet.append(el("div", {cls:"btn-row"},
      el("button", {cls:"primary", text:"Look it up", attrs:{type:"button"}, on:{click:function(){
        var q = input.value.trim();
        if (!q){ toast("Type a product name first"); input.focus(); return; }
        out.replaceChildren(
          el("div", {cls:"label-card"},
            el("h2", {text:q.slice(0,80)}),
            el("p", {cls:"brand", text:"Looks like a facial oil"}),
            el("hr", {cls:"rule"}),
            el("h3", {text:"What it does"}),
            el("p", {text:"Facial oils seal in moisture. They go last at night, after your moisturizer."}),
            el("p", {cls:"info", text:"I can't see the ingredients, so I won't guess them. Paste them or snap the label and I'll tell you more."})),
          el("div", {cls:"btn-row"},
            el("button", {cls:"secondary", text:"Paste the ingredients", attrs:{type:"button"}, on:{click:function(){ addPaste(sheet); }}}),
            el("button", {cls:"secondary", text:"Back", attrs:{type:"button"}, on:{click:function(){ addChoose(sheet); }}})));
      }}})));
    sheet.append(out);
  }

  // ---------- backup ----------
  byId("backupBtn").addEventListener("click", function(){
    openSheet(function(sheet){
      sheet.append(el("h2", {cls:"sheet-title", text:"Back up your shelf", attrs:{id:"sheetTitle"}}));
      sheet.append(el("p", {text:"Your shelf lives on this phone. A backup file keeps it safe if you switch phones or clear your browser."}));
      sheet.append(el("div", {cls:"btn-row"},
        el("button", {cls:"primary", text:"Save a backup file", attrs:{type:"button"}, on:{click:function(){ closeSheet(); toast("Backup saved (mockup)"); }}}),
        el("button", {cls:"secondary", text:"Restore from a backup", attrs:{type:"button"}, on:{click:function(){ closeSheet(); toast("Restore comes in the build"); }}})));
    });
  });

  // ---------- tabs ----------
  function syncTabs(){
    document.querySelectorAll(".tab").forEach(function(t){ t.setAttribute("aria-selected", String(t.dataset.view === view)); });
  }
  document.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click", function(){ view = t.dataset.view; syncTabs(); render(); });
  });
  byId("addBtn").addEventListener("click", openAdd);

  byId("greeting").textContent = "Okay, let's see what you're working with.";
  var lines = ["Thinnest to thickest.", "Sunscreen is always last.", "Don't mix your retinol and your acids.", "Patch test the new stuff.", "Open it, date it."];
  var track = byId("marquee");
  for (var r = 0; r < 2; r++){
    lines.forEach(function(l){
      track.append(el("span", {text:l}));
      track.append(el("span", {cls:"gem", text:"\u25C6"}));
    });
  }
  byId("aboutBtn").addEventListener("click", function(){
    openSheet(function(sheet){
      sheet.append(el("h2", {cls:"sheet-title", text:"About Two Sisters Tinctures", attrs:{id:"sheetTitle"}}));
      sheet.append(el("p", {text:"One sister built this for the other, so she could keep track of her shelf and stop answering the same serum questions in the group chat."}));
      sheet.append(el("p", {text:"Gemma reads labels and explains products. Routine order, warnings, and shelf life come from fixed rules, not the model."}));
      sheet.append(el("p", {cls:"info", text:"I know skincare, not medicine. If something's irritated, see a dermatologist. Two Sisters Tinctures explains products. It doesn't diagnose skin conditions."}));
      sheet.append(el("p", {cls:"fine", text:"Hero painting generated with Gemini."}));
    });
  });

  try { render(); }
  catch (err){
    byId("view").replaceChildren(el("p", {cls:"demo-banner", text:"The shelf didn't load. Refresh the page to try again."}));
  }
})();
</script>
</body>
</html>
